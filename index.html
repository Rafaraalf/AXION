
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AXION | Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1220;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #172235;
      border: 1px solid #29374b;
      border-radius: 20px;
      padding: 36px;
    }
    h1 {
      font-size: 36px;
      letter-spacing: 5px;
      margin: 0;
      text-align: center;
    }
    .sub {
      color: #94a3b8;
      text-align: center;
      margin: 12px 0 32px;
    }
    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #40516a;
      border-radius: 10px;
      background: #0b1220;
      color: white;
      font-size: 16px;
    }
    input:focus {
      outline: 2px solid #38bdf8;
    }
    button {
      width: 100%;
      margin-top: 26px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: #07111f;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      opacity: .6;
      cursor: wait;
    }
    #mensagem {
      min-height: 20px;
      color: #fca5a5;
      text-align: center;
      font-size: 14px;
      margin-top: 16px;
    }
    .painel { display: none; }
    .painel p {
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

  <main class="card">
    <section id="login">
      <h1>AXION</h1>
      <p class="sub">Gestão de estoque e abastecimento</p>

      <form id="formLogin">
        <label for="usuario">Usuário</label>
        <input id="usuario" autocomplete="username" required>

        <label for="senha">Senha</label>
        <input id="senha" type="password"
               autocomplete="current-password" required>

        <button id="entrar" type="submit">Entrar</button>
      </form>

      <div id="mensagem" role="status"></div>
    </section>

    <section id="painel" class="painel">
      <h1>AXION</h1>
      <p>Login realizado com sucesso!</p>
      <p>O painel de estoque será construído aqui.</p>
      <button id="sair">Sair</button>
    </section>
  </main>

  <script>
    const API = "https://axion-api.rafa-losneto.workers.dev";

    const login = document.getElementById("login");
    const painel = document.getElementById("painel");
    const mensagem = document.getElementById("mensagem");
    const entrar = document.getElementById("entrar");

    let tokenSessao = null;

    function mostrarPainel() {
      login.style.display = "none";
      painel.style.display = "block";
    }

    function mostrarLogin() {
      painel.style.display = "none";
      login.style.display = "block";
    }

    document.getElementById("formLogin")
      .addEventListener("submit", async (evento) => {
        evento.preventDefault();

        mensagem.textContent = "";
        entrar.disabled = true;
        entrar.textContent = "Entrando...";

        try {
          const resposta = await fetch(API + "/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              usuario: document.getElementById("usuario").value,
              senha: document.getElementById("senha").value
            })
          });

          const dados = await resposta.json();

          if (!resposta.ok || !dados.ok) {
            mensagem.textContent =
              dados.erro || "Não foi possível entrar.";
            return;
          }

          tokenSessao = dados.token;
          document.getElementById("senha").value = "";
          mostrarPainel();

        } catch (erro) {
          mensagem.textContent =
            "Não foi possível conectar à API.";
        } finally {
          entrar.disabled = false;
          entrar.textContent = "Entrar";
        }
      });

    document.getElementById("sair")
      .addEventListener("click", async () => {
        const token = tokenSessao;
        tokenSessao = null;
        mostrarLogin();

        if (token) {
          try {
            await fetch(API + "/auth/logout", {
              method: "POST",
              headers: {
                Authorization: "Bearer " + token
              }
            });
          } catch (erro) {
            console.error("Falha ao encerrar sessão", erro);
          }
        }
      });
  </script>
</body>
</html>
